[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
timeout = 120
markers =
    sitl: requires a running ArduCopter SITL instance
    flight: the vehicle takes off during the test (slow)
    last: leaves simulator state that may persist until SITL restarts; runs after all other tests
